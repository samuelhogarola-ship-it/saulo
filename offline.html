<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>En desarrollo</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08080c;
        --panel: rgba(10, 10, 16, 0.76);
        --fg: #f5f5f7;
        --muted: rgba(245, 245, 247, 0.72);
        --line: rgba(255, 255, 255, 0.1);
        --accent: #8b5cf6;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background:
          radial-gradient(
            circle at 50% 18%,
            rgba(139, 92, 246, 0.28),
            transparent 32%
          ),
          radial-gradient(
            circle at 50% 82%,
            rgba(255, 255, 255, 0.08),
            transparent 26%
          ),
          linear-gradient(180deg, #06060a 0%, var(--bg) 100%);
        color: var(--fg);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        overflow: hidden;
      }

      body::before {
        content: '';
        position: fixed;
        inset: -10%;
        background: url('./wf-logo.png') center/60vw no-repeat;
        opacity: 0.04;
        filter: blur(8px);
        pointer-events: none;
        transform: scale(1.15);
      }

      main {
        position: relative;
        width: min(860px, 100%);
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 34px 30px 28px;
        background: var(--panel);
        box-shadow: 0 30px 100px rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(14px);
      }

      .stage {
        display: grid;
        grid-template-columns: 1fr;
        gap: 22px;
        align-items: center;
        justify-items: center;
        text-align: center;
      }

      .eyebrow {
        margin: 0;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        font-size: 0.75rem;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(2.4rem, 6vw, 4.8rem);
        line-height: 0.92;
        letter-spacing: -0.05em;
      }

      .copy {
        max-width: 42rem;
        margin: 0;
        font-size: clamp(1.02rem, 2.2vw, 1.2rem);
        line-height: 1.65;
        color: var(--muted);
        text-wrap: balance;
      }

      .hero-bot {
        position: relative;
        width: min(340px, 72vw);
        aspect-ratio: 1 / 1;
        display: grid;
        place-items: center;
        margin-top: 6px;
      }

      .hero-bot img {
        position: relative;
        width: 100%;
        height: auto;
        display: block;
        filter: drop-shadow(0 20px 30px rgba(0, 0, 0, 0.36));
        animation: float 3.2s ease-in-out infinite;
      }

      .offline-byline {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        margin-top: 10px;
        color: rgba(255, 255, 255, 0.82);
        text-decoration: none;
        font-size: 0.95rem;
        letter-spacing: 0.02em;
        transition: opacity 0.2s ease;
      }

      .offline-byline:hover {
        opacity: 1;
      }

      .offline-byline span {
        color: rgba(255, 255, 255, 0.52);
      }

      .offline-byline strong {
        color: #fff;
        font-weight: 700;
      }

      .offline-watermark {
        position: absolute;
        right: 22px;
        bottom: 18px;
        width: 128px;
        opacity: 0.06;
        filter: blur(2px);
        pointer-events: none;
        user-select: none;
      }

      .offline-watermark img {
        display: block;
        width: 100%;
        height: auto;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-10px) rotate(1deg);
        }
      }

      @media (max-width: 560px) {
        body {
          padding: 18px;
        }

        main {
          padding: 26px 18px 20px;
          border-radius: 22px;
        }

        .hero-bot {
          width: min(270px, 76vw);
        }

        .offline-watermark {
          width: 96px;
          right: 12px;
          bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="stage">
        <h1>Esta web está en desarrollo.</h1>
        <p class="copy">
          Estamos preparando una nueva versión del proyecto. Volveremos pronto.
        </p>

        <div class="hero-bot" aria-hidden="true">
          <img src="./offline-bot.gif" alt="" />
        </div>

        <a
          class="offline-byline"
          href="https://webfuengirola.com"
          target="_blank"
          rel="noreferrer"
        >
          <span>by</span>
          <strong>WF-Studio</strong>
        </a>
      </div>

      <div class="offline-watermark" aria-hidden="true">
        <img src="./wf-logo.png" alt="" />
      </div>
    </main>
  </body>
</html>

<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08080c;
        --fg: #f2f2f2;
        --muted: #a2a2ab;
        --line: rgba(255, 255, 255, 0.12);
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #1b1024 0%, var(--bg) 55%);
        color: var(--fg);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 40px 28px 32px;
        background: rgba(8, 8, 12, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }
      .offline-logos {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        margin-bottom: 28px;
      }
      .offline-logo {
        flex: 1 1 0;
        display: flex;
        align-items: center;
      }
      .offline-logo img {
        display: block;
        max-width: 100%;
        height: auto;
        object-fit: contain;
      }
      .offline-logo--left img {
        max-height: 72px;
      }
      .offline-logo--right {
        justify-content: flex-end;
      }
      .offline-logo--right img {
        max-height: 72px;
      }
      .offline-divider {
        width: 1px;
        height: 72px;
        background: linear-gradient(
          to bottom,
          transparent,
          var(--line),
          transparent
        );
        flex: 0 0 auto;
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.125rem);
        line-height: 1.6;
      }
      .offline-copy strong {
        color: var(--fg);
        font-weight: 700;
      }
      .offline-copy {
        text-wrap: balance;
      }
      @media (max-width: 560px) {
        main {
          padding: 28px 18px 24px;
        }
        .offline-logos {
          gap: 12px;
          margin-bottom: 22px;
        }
        .offline-logo--left img,
        .offline-logo--right img {
          max-height: 52px;
        }
        .offline-divider {
          height: 52px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="offline-logos" aria-hidden="true">
        <div class="offline-logo offline-logo--left">
          <img src="./landing-nueva/branding.png" alt="" />
        </div>
        <div class="offline-divider"></div>
        <a
          class="offline-logo offline-logo--right"
          href="https://webfuengirola.com"
          target="_blank"
          rel="noreferrer"
          aria-label="WF-Studio"
        >
          <img src="./wf-logo.png" alt="" />
        </a>
      </div>
      <h1>Offline</h1>
      <p class="offline-copy">
        <strong>Saulo Fitness</strong> y <strong>WF-Studio</strong> han
        pospuesto este proyecto. Volveremos pronto.
      </p>
    </main>
  </body>
</html>

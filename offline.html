<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline</title>
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <meta name="color-scheme" content="dark" />
    <style>
      :root {
        color-scheme: dark;
        --bg: #08080c;
        --fg: #f2f2f2;
        --muted: #a2a2ab;
        --line: rgba(255, 255, 255, 0.12);
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: radial-gradient(circle at top, #1b1024 0%, var(--bg) 55%);
        color: var(--fg);
        font-family: Arial, Helvetica, sans-serif;
      }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        width: min(720px, 100%);
        border: 1px solid var(--line);
        border-radius: 24px;
        padding: 40px 28px;
        background: rgba(8, 8, 12, 0.72);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      }
      h1 {
        margin: 0 0 12px;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: clamp(1rem, 2.5vw, 1.125rem);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Offline</h1>
      <p>Este sitio se encuentra desactivado temporalmente.</p>
    </main>
  </body>
</html>
